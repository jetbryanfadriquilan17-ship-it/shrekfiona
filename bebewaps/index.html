<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Shrek & Fiona</title>

<!-- 🔒 KUNG NAKA-LOGIN NA, DERETSO SA INDEX -->
<script>
  if (sessionStorage.getItem('loggedIn') === 'true') {
    window.location.replace('index.html');
  }
</script>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Poppins', sans-serif;
    background: #0d0521;
    min-height: 100vh;
    overflow: hidden;
    color: #2d1b4e;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .bg-gradient {
    position: fixed;
    inset: 0;
    background: linear-gradient(-45deg, #0d0521, #2d1b4e, #6a0dad, #9d4edd, #7b2cbf, #2d1b4e, #0d0521);
    background-size: 400% 400%;
    animation: gradientShift 20s ease infinite;
    z-index: -3;
  }

  @keyframes gradientShift {
    0%,100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .stars {
    position: fixed;
    inset: 0;
    z-index: -2;
    pointer-events: none;
  }

  .star {
    position: absolute;
    background: #e0aaff;
    border-radius: 50%;
    animation: twinkle 3s infinite;
    box-shadow: 0 0 6px #c77dff;
  }

  @keyframes twinkle {
    0%,100% { opacity: 0.2; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.5); }
  }

  .float-heart {
    position: fixed;
    bottom: -60px;
    pointer-events: none;
    z-index: 1;
    animation: floatUp linear infinite;
    filter: drop-shadow(0 0 10px rgba(157,78,221,0.9));
  }

  @keyframes floatUp {
    0% { transform: translateY(0) rotate(0deg) scale(0.8); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-110vh) rotate(360deg) scale(1.2); opacity: 0; }
  }

  .login-container {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 420px;
    padding: 20px;
  }

  .login-card {
    background: #ffffff;
    border-radius: 28px;
    padding: 50px 35px 40px;
    box-shadow: 0 30px 80px rgba(157,78,221,0.5);
    text-align: center;
    position: relative;
    animation: cardPop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes cardPop {
    from { transform: scale(0.8) translateY(30px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
  }

  .login-card::before {
    content: '💜';
    position: absolute;
    top: -30px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 55px;
    filter: drop-shadow(0 5px 15px rgba(157,78,221,0.6));
    animation: heartBeat 1.5s infinite;
  }

  @keyframes heartBeat {
    0%,100% { transform: translateX(-50%) scale(1); }
    15% { transform: translateX(-50%) scale(1.2); }
    30% { transform: translateX(-50%) scale(1); }
    45% { transform: translateX(-50%) scale(1.15); }
    60% { transform: translateX(-50%) scale(1); }
  }

  .login-card img {
    max-width: 110px;
    border-radius: 16px;
    margin: 15px auto 10px;
    display: block;
  }

  .login-card h1 {
    font-family: 'Dancing Script', cursive;
    font-size: 42px;
    color: #6a0dad;
    margin-bottom: 8px;
    line-height: 1.2;
  }

  .login-card .subtitle {
    font-size: 14px;
    color: #7b2cbf;
    margin-bottom: 30px;
    letter-spacing: 1px;
    font-weight: 400;
  }

  .input-group {
    position: relative;
    margin-bottom: 20px;
  }

  .input-group input {
    width: 100%;
    padding: 16px 20px 16px 50px;
    border: 2px solid #e0c3fc;
    border-radius: 50px;
    font-family: 'Poppins', sans-serif;
    font-size: 15px;
    color: #2d1b4e;
    background: #faf5ff;
    outline: none;
    transition: all 0.3s;
  }

  .input-group input:focus {
    border-color: #9d4edd;
    background: #ffffff;
    box-shadow: 0 0 0 4px rgba(157,78,221,0.15);
  }

  .input-group input::placeholder {
    color: #b19cd9;
  }

  .input-icon {
    position: absolute;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 18px;
    pointer-events: none;
    opacity: 0.7;
  }

  .toggle-password {
    position: absolute;
    right: 18px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    font-size: 18px;
    cursor: pointer;
    opacity: 0.6;
    transition: opacity 0.3s;
    padding: 5px;
  }

  .toggle-password:hover {
    opacity: 1;
  }

  .login-btn {
    width: 100%;
    padding: 16px;
    background: linear-gradient(45deg, #9d4edd, #6a0dad);
    color: white;
    border: none;
    border-radius: 50px;
    font-family: 'Poppins', sans-serif;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(157,78,221,0.5);
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
    margin-top: 10px;
  }

  .login-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(45deg, #e0aaff, #c77dff);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .login-btn:hover::before { opacity: 1; }
  .login-btn:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 15px 40px rgba(157,78,221,0.8);
    color: #2d1b4e;
  }
  .login-btn:active { transform: scale(0.97); }
  .login-btn span { position: relative; z-index: 1; }

  .error-msg {
    color: #e63946;
    font-size: 13px;
    margin-top: 15px;
    min-height: 20px;
    font-weight: 500;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .error-msg.show {
    opacity: 1;
    animation: shake 0.4s;
  }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }

  .footer-text {
    margin-top: 25px;
    font-size: 12px;
    color: #7b2cbf;
    opacity: 0.7;
    letter-spacing: 0.5px;
  }

  @media (max-width: 480px) {
    .login-card {
      padding: 45px 25px 35px;
    }
    .login-card h1 {
      font-size: 36px;
    }
  }
</style>
</head>
<body>

<div class="bg-gradient"></div>
<div class="stars" id="stars"></div>

<div class="login-container">
  <div class="login-card">
    <img src="shrek.gif" alt="Shrek">
    <h1>Shrek & Fiona</h1>
    <p class="subtitle">- Jaybeee 💜</p>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="input-group">
        <span class="input-icon">👤</span>
        <input type="text" id="username" placeholder="Pangalan mo..." autocomplete="username" required>
      </div>

      <div class="input-group">
        <span class="input-icon">🔒</span>
        <input type="password" id="password" placeholder="Password..." autocomplete="current-password" required>
        <button type="button" class="toggle-password" onclick="togglePassword()" id="toggleBtn">👁️</button>
      </div>

      <button type="submit" class="login-btn">
        <span>💜 Pumasok</span>
      </button>

      <div class="error-msg" id="errorMsg"></div>
    </form>

    <p class="footer-text">Para kay Fiona lang 💕</p>
  </div>
</div>

<script>
  // ==================================================
  // 🔐 LOGIN CREDENTIALS
  // Palitan mo ito ng gusto mong username at password
  // ==================================================
  const VALID_USERNAME = 'fiona';       // ⬅️ PALITAN
  const VALID_PASSWORD = 'shrek123';    // ⬅️ PALITAN

  // ==================================================
  // 👁️ TOGGLE PASSWORD VISIBILITY
  // ==================================================
  function togglePassword() {
    const passwordInput = document.getElementById('password');
    const toggleBtn = document.getElementById('toggleBtn');

    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      toggleBtn.textContent = '🙈';
    } else {
      passwordInput.type = 'password';
      toggleBtn.textContent = '👁️';
    }
  }

  // ==================================================
  // ✅ HANDLE LOGIN
  // ==================================================
  function handleLogin(e) {
    e.preventDefault();

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('errorMsg');

    // Check credentials
    if (username.toLowerCase() === VALID_USERNAME.toLowerCase() && password === VALID_PASSWORD) {
      // ✅ TAMA - I-set MUNA ang sessionStorage, TAPOS mag-redirect
      sessionStorage.setItem('loggedIn', 'true');
      sessionStorage.setItem('username', username);

      errorMsg.textContent = '💜 Welcome, ' + username + '!';
      errorMsg.style.color = '#6a0dad';
      errorMsg.classList.add('show');

      // Confetti effect bago mag-redirect
      createConfetti();

      // Redirect pagkatapos ng maikling delay
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 800);

    } else {
      // ❌ MALI - ipakita ang error
      errorMsg.textContent = '❌ Mali ang username o password!';
      errorMsg.style.color = '#e63946';
      errorMsg.classList.remove('show');
      void errorMsg.offsetWidth; // trigger reflow para umulit ang animation
      errorMsg.classList.add('show');

      // Shake animation
      document.getElementById('password').value = '';
      document.getElementById('password').focus();

      // Hearts para sa effect
      for (let i = 0; i < 5; i++) setTimeout(createHeart, i * 80);
    }
  }

  // ==================================================
  // ⭐ STARS
  // ==================================================
  function createStars() {
    const container = document.getElementById('stars');
    for (let i = 0; i < 60; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      const size = Math.random() * 3 + 1;
      star.style.width = size + 'px';
      star.style.height = size + 'px';
      star.style.left = Math.random() * 100 + 'vw';
      star.style.top = Math.random() * 100 + 'vh';
      star.style.animationDelay = Math.random() * 3 + 's';
      star.style.animationDuration = (2 + Math.random() * 3) + 's';
      container.appendChild(star);
    }
  }
  createStars();

  // ==================================================
  // 💜 FLOATING HEARTS
  // ==================================================
  function createHeart() {
    const h = document.createElement('div');
    h.className = 'float-heart';
    const hearts = ['💜','💜','💕','💗','💞','🌸','✨','💝','🟣'];
    h.textContent = hearts[Math.floor(Math.random() * hearts.length)];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.animationDuration = (6 + Math.random() * 6) + 's';
    h.style.fontSize = (16 + Math.random() * 24) + 'px';
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 12000);
  }
  setInterval(createHeart, 900);
  for (let i = 0; i < 8; i++) setTimeout(createHeart, i * 200);

  // ==================================================
  // 🎉 CONFETTI
  // ==================================================
  function createConfetti() {
    const colors = ['#9d4edd', '#c77dff', '#e0aaff', '#6a0dad', '#b19cd9', '#fff'];
    for (let i = 0; i < 40; i++) {
      const confetti = document.createElement('div');
      confetti.style.position = 'fixed';
      confetti.style.width = '10px';
      confetti.style.height = '10px';
      confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
      confetti.style.left = Math.random() * 100 + 'vw';
      confetti.style.top = '-20px';
      confetti.style.zIndex = '999';
      confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
      confetti.style.pointerEvents = 'none';
      confetti.style.transition = `all ${1.5 + Math.random() * 1.5}s ease-out`;
      document.body.appendChild(confetti);
      setTimeout(() => {
        confetti.style.top = (100 + Math.random() * 20) + 'vh';
        confetti.style.transform = `rotate(${Math.random() * 720}deg)`;
        confetti.style.opacity = '0';
      }, 50);
      setTimeout(() => confetti.remove(), 3500);
    }
  }

  // ==================================================
  // ⌨️ AUTO-FOCUS SA USERNAME
  // ==================================================
  window.addEventListener('DOMContentLoaded', () => {
    document.getElementById('username').focus();
  });
</script>

</body>
</html>
